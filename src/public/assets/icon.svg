<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1e33" />
      <stop offset="100%" stop-color="#050a12" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" stroke="#00f2fe" stroke-width="2" stroke-opacity="0.3" />

  <!-- Radio / LAN Waves -->
  <g fill="none" stroke="url(#neonCyan)" stroke-linecap="round" opacity="0.45" filter="url(#glow)">
    <circle cx="128" cy="128" r="86" stroke-width="3" stroke-dasharray="24 16 36 16" />
    <circle cx="128" cy="128" r="68" stroke-width="3.5" stroke-dasharray="16 12 28 12" />
  </g>

  <!-- Camera Outer Ring -->
  <circle cx="128" cy="128" r="50" fill="#091422" stroke="url(#neonGreen)" stroke-width="4" filter="url(#glow)" />

  <!-- Aperture Blades -->
  <g fill="url(#neonGreen)" opacity="0.9" stroke="#050b14" stroke-width="2.5">
    <!-- Blade 1 -->
    <path d="M128 84 A44 44 0 0 1 166 104 L138 122 Z" />
    <!-- Blade 2 -->
    <path d="M166 104 A44 44 0 0 1 172 148 L142 136 Z" />
    <!-- Blade 3 -->
    <path d="M172 148 A44 44 0 0 1 142 170 L130 142 Z" />
    <!-- Blade 4 -->
    <path d="M142 170 A44 44 0 0 1 98 162 L116 136 Z" />
    <!-- Blade 5 -->
    <path d="M98 162 A44 44 0 0 1 84 122 L116 120 Z" />
    <!-- Blade 6 -->
    <path d="M84 122 A44 44 0 0 1 114 86 L124 114 Z" />
  </g>

  <!-- Inner Center Lens -->
  <circle cx="128" cy="128" r="14" fill="#ffffff" opacity="0.95" filter="url(#glow)" />
  <circle cx="128" cy="128" r="8" fill="#00f2fe" />
</svg>
